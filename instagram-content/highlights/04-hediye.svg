<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Background -->
  <circle cx="540" cy="540" r="540" fill="#1a1a1a"/>

  <!-- Gift Box icon -->
  <g transform="translate(540, 470)" fill="none" stroke="#B8860B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Box lid -->
    <rect x="-130" y="-60" width="260" height="60" rx="6"/>
    <!-- Box body -->
    <rect x="-110" y="0" width="220" height="160" rx="4"/>
    <!-- Vertical ribbon -->
    <line x1="0" y1="-60" x2="0" y2="160"/>
    <!-- Horizontal ribbon on lid -->
    <line x1="-130" y1="-30" x2="130" y2="-30"/>
    <!-- Bow - left loop -->
    <path d="M0,-60 Q-60,-110 -50,-140 Q-40,-160 -10,-140 Q10,-130 0,-60"/>
    <!-- Bow - right loop -->
    <path d="M0,-60 Q60,-110 50,-140 Q40,-160 10,-140 Q-10,-130 0,-60"/>
    <!-- Bow center knot -->
    <circle cx="0" cy="-65" r="8" fill="#B8860B"/>
  </g>

  <!-- Label -->
  <text x="540" y="740" text-anchor="middle" fill="#B8860B" font-family="'Playfair Display', 'Georgia', serif" font-size="42" font-weight="400" letter-spacing="6">HEDİYE</text>

  <!-- Subtle decorative line -->
  <line x1="445" y1="770" x2="635" y2="770" stroke="#B8860B" stroke-width="1" opacity="0.4"/>
</svg>