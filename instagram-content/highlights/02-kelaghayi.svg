<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Background -->
  <circle cx="540" cy="540" r="540" fill="#1a1a1a"/>

  <!-- Kelaghayi / Headscarf silhouette icon -->
  <g transform="translate(540, 470)" fill="none" stroke="#B8860B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head circle -->
    <circle cx="0" cy="-80" r="55"/>
    <!-- Scarf draped over head - flowing form -->
    <path d="M-70,-110 Q-90,-130 -80,-160 Q-60,-180 0,-180 Q60,-180 80,-160 Q90,-130 70,-110"/>
    <!-- Scarf body flowing down -->
    <path d="M-70,-110 Q-100,-60 -110,0 Q-115,40 -100,80 Q-80,130 -40,160 L0,170"/>
    <path d="M70,-110 Q80,-80 75,-40 Q70,10 50,60 Q30,110 0,170"/>
    <!-- Decorative fold line -->
    <path d="M-50,-140 Q-20,-120 20,-130 Q50,-140 60,-150" opacity="0.6"/>
    <!-- Inner drape detail -->
    <path d="M-60,-100 Q-70,-50 -65,10 Q-55,60 -30,120" opacity="0.4"/>
  </g>

  <!-- Label -->
  <text x="540" y="740" text-anchor="middle" fill="#B8860B" font-family="'Playfair Display', 'Georgia', serif" font-size="42" font-weight="400" letter-spacing="6">KELAGHAYİ</text>

  <!-- Subtle decorative line -->
  <line x1="420" y1="770" x2="660" y2="770" stroke="#B8860B" stroke-width="1" opacity="0.4"/>
</svg>