<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="540" cy="540" r="540"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="540" cy="540" r="540" fill="#1a1a1a"/>

  <!-- Diamond Icon - elegant geometric diamond -->
  <g transform="translate(540, 480)" fill="none" stroke="#B8860B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Diamond top facets -->
    <polygon points="0,-160 140,-40 0,160 -140,-40" fill="none"/>
    <!-- Crown line -->
    <line x1="-140" y1="-40" x2="140" y2="-40"/>
    <!-- Inner facet lines -->
    <line x1="-70" y1="-160" x2="-50" y2="-40"/>
    <line x1="70" y1="-160" x2="50" y2="-40"/>
    <line x1="-50" y1="-40" x2="0" y2="160"/>
    <line x1="50" y1="-40" x2="0" y2="160"/>
    <!-- Top edge facets -->
    <line x1="-140" y1="-40" x2="-70" y2="-160"/>
    <line x1="140" y1="-40" x2="70" y2="-160"/>
    <line x1="-70" y1="-160" x2="0" y2="-160"/>
    <line x1="70" y1="-160" x2="0" y2="-160"/>
  </g>

  <!-- Label -->
  <text x="540" y="740" text-anchor="middle" fill="#B8860B" font-family="'Playfair Display', 'Georgia', serif" font-size="42" font-weight="400" letter-spacing="6">KOLEKSİYON</text>

  <!-- Subtle decorative line -->
  <line x1="420" y1="770" x2="660" y2="770" stroke="#B8860B" stroke-width="1" opacity="0.4"/>
</svg>