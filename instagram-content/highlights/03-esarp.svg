<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Background -->
  <circle cx="540" cy="540" r="540" fill="#1a1a1a"/>

  <!-- Flowing Scarf / Eşarp icon - elegant draped silk -->
  <g transform="translate(540, 470)" fill="none" stroke="#B8860B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main scarf flowing shape - S-curve drape -->
    <path d="M-80,-160 Q-60,-160 -40,-150 Q20,-130 40,-80 Q60,-30 20,20 Q-20,70 -40,120 Q-55,155 -30,170 Q0,185 40,170"/>
    <!-- Parallel edge of scarf width -->
    <path d="M-40,-160 Q-20,-160 0,-150 Q60,-130 80,-80 Q100,-30 60,20 Q20,70 0,120 Q-15,155 10,170 Q40,185 80,170"/>
    <!-- Top connecting edge -->
    <line x1="-80" y1="-160" x2="-40" y2="-160"/>
    <!-- Bottom connecting edge -->
    <path d="M40,170 Q55,165 65,170 Q75,175 80,170"/>
    <!-- Subtle fabric fold lines -->
    <path d="M-30,-120 Q10,-100 30,-60" opacity="0.3" stroke-width="3"/>
    <path d="M-10,-30 Q20,10 10,60" opacity="0.3" stroke-width="3"/>
    <path d="M-20,80 Q-5,110 0,140" opacity="0.3" stroke-width="3"/>
    <!-- Fringe detail at bottom -->
    <line x1="42" y1="170" x2="38" y2="190" opacity="0.5" stroke-width="2"/>
    <line x1="50" y1="170" x2="48" y2="190" opacity="0.5" stroke-width="2"/>
    <line x1="58" y1="170" x2="56" y2="190" opacity="0.5" stroke-width="2"/>
    <line x1="66" y1="170" x2="64" y2="190" opacity="0.5" stroke-width="2"/>
    <line x1="74" y1="170" x2="72" y2="190" opacity="0.5" stroke-width="2"/>
  </g>

  <!-- Label -->
  <text x="540" y="740" text-anchor="middle" fill="#B8860B" font-family="'Playfair Display', 'Georgia', serif" font-size="42" font-weight="400" letter-spacing="6">EŞARP</text>

  <!-- Subtle decorative line -->
  <line x1="455" y1="770" x2="625" y2="770" stroke="#B8860B" stroke-width="1" opacity="0.4"/>
</svg>